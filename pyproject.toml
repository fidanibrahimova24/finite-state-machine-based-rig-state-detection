[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextual-rig-state-fsm"
version = "0.2.0rc1"
description = "Open-source finite-state machine for automated drilling-rig operational-state classification from real-time surface drilling data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Fidan Ibrahimova"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "plotly>=5.18", "PyYAML>=6.0"]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
test = ["pytest>=8"]

[project.scripts]
rig-state-fsm = "rig_state_fsm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
